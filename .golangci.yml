version: "2"

linters:
  enable:
    - bodyclose
    - errorlint
    - gocyclo
    - gosec
    - misspell
    - noctx
    - unconvert
  settings:
    gocyclo:
      min-complexity: 10
  exclusions:
    presets:
      - std-error-handling
    rules:
      # Tests use fake credentials throughout.
      - path: _test\.go
        linters:
          - gosec
        text: G101

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    gofmt:
      simplify: true
